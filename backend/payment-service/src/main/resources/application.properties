# ==============================================================================
# BIDVELOCITY - PAYMENT SERVICE CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DATABASE CONFIGURATION
# Edit database name, username, and password below as needed.
# Tables ('payments') will be automatically created on startup by Hibernate.
# ------------------------------------------------------------------------------
spring.application.name=payment-service

# Set your PostgreSQL URL, database name, username, and password here:
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${PAYMENT_DB_NAME:bidvelocity_payment}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# 2. JPA & HIBERNATE SCHEMA AUTO-GENERATION
# 'ddl-auto=update' ensures tables, primary keys, and columns are automatically
# generated in PostgreSQL on service start without dropping existing data.
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# 3. SERVER & PORT
# ------------------------------------------------------------------------------
server.port=8084

# ------------------------------------------------------------------------------
# 4. EUREKA SERVICE DISCOVERY (LOCAL & CLOUD)
# ------------------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# ------------------------------------------------------------------------------
# 5. MOCK PAYMENT GATEWAY & INTERNAL PROTECTION
# ------------------------------------------------------------------------------
payment.checkout.base-url=${CHECKOUT_BASE_URL:http://localhost:8080}
payment.checkout.token-validity-minutes=15
payment.webhook.secret=${WEBHOOK_SECRET:bidvelocity-mock-payment-gateway-hmac-sha256-secret-key-2026}

bidvelocity.security.internal-secret=${INTERNAL_SERVICE_SECRET:bidvelocity-internal-secure-secret-2026}

# ------------------------------------------------------------------------------
# 6. ACTUATOR & HEALTH MONITORING
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
