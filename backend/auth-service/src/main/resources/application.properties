# ==============================================================================
# BIDVELOCITY - AUTH SERVICE CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DATABASE CONFIGURATION
# Edit database name, username, and password below as needed.
# Tables ('users') will be automatically created on startup by Hibernate.
# ------------------------------------------------------------------------------
spring.application.name=auth-service

# Set your PostgreSQL URL, database name, username, and password here:
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${AUTH_DB_NAME:bidvelocity_auth}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# 2. JPA & HIBERNATE SCHEMA AUTO-GENERATION
# 'ddl-auto=update' ensures tables, primary keys, and columns are automatically
# generated in PostgreSQL on service start without dropping existing data.
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# 3. SERVER & PORT
# ------------------------------------------------------------------------------
server.port=8081

# ------------------------------------------------------------------------------
# 4. EUREKA SERVICE DISCOVERY (LOCAL & CLOUD)
# ------------------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# ------------------------------------------------------------------------------
# 5. JWT & SECURITY
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:BidVelocitySecretKey2026ForAcademicDistributedSystemsEvaluationMustBeVeryLong32CharsMin}
jwt.expiration-ms=86400000

# ------------------------------------------------------------------------------
# 6. ACTUATOR & HEALTH MONITORING
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
