# ==============================================================================
# BIDVELOCITY - REACTIVE API GATEWAY CONFIGURATION
# ==============================================================================
spring.application.name=api-gateway
server.port=8080

# ------------------------------------------------------------------------------
# 1. GATEWAY ROUTES
# ------------------------------------------------------------------------------
# Route 1: Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 2: Auction Service
spring.cloud.gateway.routes[1].id=auction-service
spring.cloud.gateway.routes[1].uri=lb://AUCTION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auctions/**

# Route 3: Bidding Service
spring.cloud.gateway.routes[2].id=bidding-service
spring.cloud.gateway.routes[2].uri=lb://BIDDING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bids/**

# Route 4: Payment Service
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**

# ------------------------------------------------------------------------------
# 2. GLOBAL CORS CONFIGURATION (Local Dev & Production)
# ------------------------------------------------------------------------------
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
# Downstream MVC controllers also declare CORS for direct development access.
# Keep the gateway's origin-specific header when a proxied response includes a
# second permissive header, otherwise browsers reject the response as invalid CORS.
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ------------------------------------------------------------------------------
# 3. EUREKA SERVICE DISCOVERY (LOCAL & CLOUD)
# ------------------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# Dynamic service discovery routing support (e.g. /auth-service/**)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


# ------------------------------------------------------------------------------
# 4. JWT & SECURITY
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:BidVelocitySecretKey2026ForAcademicDistributedSystemsEvaluationMustBeVeryLong32CharsMin}

# ------------------------------------------------------------------------------
# 5. ACTUATOR & HEALTH MONITORING
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
# Actuator endpoints are queried directly by the Vite development server for
# the frontend diagnostics, so they need their own CORS policy in addition to
# the gateway route CORS policy above.
management.endpoints.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.allow-credentials=true
